name: Soak

on:
  workflow_dispatch:
    inputs:
      duration-minutes:
        description: "Soak length: 1–300 minutes (reserves 60 minutes for setup and reporting)"
        default: "120"
      total-pages:
        description: "Stop after this many pages; 0 runs for the full duration"
        default: "0"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check hosted soak duration
        env:
          DURATION_MINUTES: ${{ inputs.duration-minutes }}
        run: |
          if ! [[ "$DURATION_MINUTES" =~ ^[1-9][0-9]{0,2}$ ]] || (( DURATION_MINUTES > 300 )); then
            echo "duration-minutes must be between 1 and 300 on GitHub-hosted runners." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - env:
          DURATION_MINUTES: ${{ inputs.duration-minutes }}
          TOTAL_PAGES: ${{ inputs.total-pages }}
        run: >-
          pnpm bench:soak
          --duration-minutes "$DURATION_MINUTES"
          --total-pages "$TOTAL_PAGES"
          --report-dir benchmarks/reports/soak
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: benchmarks/reports/soak

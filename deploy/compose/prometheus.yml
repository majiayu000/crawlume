# Scrapes the control plane over the shared loopback and evaluates Crawlume's alert rules.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: crawlume-control-plane
    static_configs:
      - targets: ["127.0.0.1:9464"]

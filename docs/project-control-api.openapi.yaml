openapi: 3.2.0
info:
  title: Diaoyan Project Control API
  version: 1.0.0
  description: Project-scoped API for server integrations and authenticated human administrators.
servers:
  - url: https://control.example/v1
security:
  - ProjectApiKey: []
x-max-body-bytes: 65536
paths:
  /auth/oidc/begin:
    get:
      operationId: beginHumanOidcLogin
      summary: Begin an OIDC Authorization Code + PKCE login
      description: Creates one bounded login attempt. No request body or query parameters are accepted.
      security: []
      responses:
        '302':
          description: Redirect to the configured OIDC Provider
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              description: Secure HttpOnly SameSite=Lax state cookie scoped to the callback path.
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
        '400': { $ref: '#/components/responses/HumanAuthBadRequest' }
        '429': { $ref: '#/components/responses/HumanAuthRateLimited' }
        '500': { $ref: '#/components/responses/HumanAuthInternalError' }
  /auth/oidc/callback:
    get:
      operationId: completeHumanOidcLogin
      summary: Complete an OIDC login and establish a human session
      description: >-
        Requires exactly one state plus either one authorization code or one Provider error.
        Provider error details are never reflected in the response.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { $ref: '#/components/schemas/OidcState' }
        - name: code
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: error
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: error_description
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: error_uri
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: __Secure-diaoyan_oidc_state
          in: cookie
          required: true
          description: Secure HttpOnly SameSite=Lax browser binding; must equal the state query value.
          schema: { $ref: '#/components/schemas/OidcState' }
      responses:
        '200':
          description: Login completed; keep the Access Token in memory only
          headers:
            Set-Cookie:
              description: Clears the state cookie and sets the rotated Secure HttpOnly refresh cookie.
              schema:
                type: array
                items: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanLoginResponse' }
        '400': { $ref: '#/components/responses/HumanAuthBadRequest' }
        '401': { $ref: '#/components/responses/HumanAuthUnauthorized' }
        '500': { $ref: '#/components/responses/HumanAuthInternalError' }
  /auth/refresh:
    post:
      operationId: refreshHumanSession
      summary: Rotate the HttpOnly refresh cookie and issue a new Access Token
      description: Accepts no request body or query parameters.
      security:
        - HumanRefreshCookie: []
      responses:
        '200':
          description: Refresh rotation completed; keep the Access Token in memory only
          headers:
            Set-Cookie:
              description: Rotated Secure HttpOnly SameSite=Strict cookie scoped to /v1/auth/refresh.
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanAccessTokenResponse' }
        '400': { $ref: '#/components/responses/HumanAuthBadRequest' }
        '401': { $ref: '#/components/responses/HumanAuthUnauthorized' }
        '409': { $ref: '#/components/responses/RefreshRotationConflict' }
        '500': { $ref: '#/components/responses/HumanAuthInternalError' }
  /auth/logout:
    post:
      operationId: logoutHumanSession
      summary: Revoke every refresh session for the authenticated user
      description: Accepts no request body or query parameters.
      security:
        - HumanAccessToken: []
      responses:
        '204':
          description: Sessions revoked and the refresh cookie cleared
          headers:
            Set-Cookie:
              description: Expires the refresh cookie at /v1/auth/refresh.
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
        '400': { $ref: '#/components/responses/HumanAuthBadRequest' }
        '401': { $ref: '#/components/responses/HumanAccessTokenUnauthorized' }
        '500': { $ref: '#/components/responses/HumanAuthInternalError' }
  /organizations:
    get:
      operationId: listOrganizations
      summary: List Organizations visible to the authenticated user
      security:
        - HumanAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OpaqueCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Reverse-chronological Organization memberships
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, organizations, pagination]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  organizations:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizationSummary' }
                  pagination: { $ref: '#/components/schemas/CursorPagination' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /organizations/{organization_id}/projects:
    get:
      operationId: listOrganizationProjects
      summary: List Projects in one Organization membership
      security:
        - HumanAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OpaqueCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Reverse-chronological Projects in the Organization
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, projects, pagination]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectSummary' }
                  pagination: { $ref: '#/components/schemas/CursorPagination' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '404': { $ref: '#/components/responses/OrganizationNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createOrganizationProject
      summary: Create or idempotently replay a Project in an Organization
      security:
        - HumanAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name]
              properties:
                slug: { type: string, minLength: 1, pattern: '\S' }
                name: { type: string, minLength: 1, pattern: '\S' }
      responses:
        '201':
          description: Newly created Project or the original Project for an identical replay
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, project]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  project: { $ref: '#/components/schemas/ProjectSummary' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '403': { $ref: '#/components/responses/HumanOrganizationForbidden' }
        '404': { $ref: '#/components/responses/OrganizationNotFound' }
        '409': { $ref: '#/components/responses/ProjectCreationConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ProjectValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/jobs:
    post:
      operationId: createProjectJob
      summary: Create or idempotently replay a Project Job
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: The newly created Job or the original Job for an identical replay
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, job]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  job:
                    $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '402':
          $ref: '#/components/responses/CreditsExhausted'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/jobs/{job_id}:
    get:
      operationId: getProjectJob
      summary: Read one Job from the API Key's Project
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The Project-scoped Job
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, job]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  job:
                    $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/jobs/{job_id}/pause:
    post:
      operationId: pauseProjectJob
      summary: Idempotently pause a queued or active Project Job
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The paused Job, including an idempotent replay
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, job]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  job:
                    allOf:
                      - $ref: '#/components/schemas/Job'
                      - type: object
                        properties:
                          status: { const: paused }
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/JobTransitionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/jobs/{job_id}/resume:
    post:
      operationId: resumeProjectJob
      summary: Idempotently return a paused Project Job to the queue
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The queued Job, including an idempotent replay
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, job]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  job:
                    allOf:
                      - $ref: '#/components/schemas/Job'
                      - type: object
                        properties:
                          status: { const: queued }
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/JobTransitionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/jobs/{job_id}/cancel:
    post:
      operationId: cancelProjectJob
      summary: Idempotently cancel a non-terminal Project Job and its active Lease
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The cancelled Job, including an idempotent replay
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, job]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  job:
                    $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/JobTransitionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/jobs/{job_id}/publications:
    get:
      operationId: listProjectJobPublications
      summary: List Artifact publications for one Project Job
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Sequence-ordered Project publications
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, publications, pagination]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  publications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Publication'
                  pagination:
                    type: object
                    additionalProperties: false
                    required: [next_sequence, has_more, limit]
                    properties:
                      next_sequence:
                        oneOf:
                          - type: integer
                            minimum: 1
                          - type: 'null'
                      has_more:
                        type: boolean
                      limit:
                        type: integer
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/webhook-endpoints:
    post:
      operationId: createWebhookEndpoint
      summary: Register a signed webhook endpoint; the secret is returned only once
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, event_types]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: Public https URL; private and loopback targets are rejected.
                event_types:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/WebhookEventType'
      responses:
        '201':
          description: The new endpoint and its whsec_ signing secret
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, endpoint, secret]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  endpoint:
                    $ref: '#/components/schemas/WebhookEndpoint'
                  secret:
                    type: string
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/WebhooksDisabled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listWebhookEndpoints
      summary: List the Project's webhook endpoints
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Up to 100 endpoints, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, endpoints]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  endpoints:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/webhook-endpoints/{endpoint_id}:
    delete:
      operationId: disableWebhookEndpoint
      summary: Disable an endpoint; its pending deliveries become dead letters
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: endpoint_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: The endpoint is disabled
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/webhook-endpoints/{endpoint_id}/rotate-secret:
    post:
      operationId: rotateWebhookEndpointSecret
      summary: Issue a new secret; deliveries are signed with both secrets for 24 hours
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: endpoint_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The new whsec_ signing secret
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, secret]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  secret:
                    type: string
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/WebhooksDisabled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/webhook-events/{event_id}/redeliver:
    post:
      operationId: redeliverWebhookEvent
      summary: Queue a new delivery of an event to every active subscribed endpoint
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: event_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '202':
          description: The number of deliveries queued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, queued]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  queued:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/WebhooksDisabled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List recent webhook deliveries, newest first
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Recent deliveries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, deliveries]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/artifacts/{artifact_id}/download:
    get:
      operationId: getProjectArtifactDownload
      summary: Get a 5-minute presigned download URL for an uploaded cloud Artifact
      description: Requires results:read. Every issued URL is recorded as an artifact.downloaded audit event.
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: artifact_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Short-lived download URL
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, url, expires_at]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ArtifactNotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ArtifactStorageDisabled'
  /projects/{project_id}/audit-events:
    get:
      operationId: listProjectAuditEvents
      summary: List append-only audit events for one Project
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Reverse-chronological Project audit events
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, audit_events, pagination]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  audit_events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  pagination:
                    type: object
                    additionalProperties: false
                    required: [next_cursor, has_more, limit]
                    properties:
                      next_cursor:
                        oneOf:
                          - type: string
                          - type: 'null'
                      has_more: { type: boolean }
                      limit: { type: integer }
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/api-keys:
    post:
      operationId: createProjectApiKey
      summary: Create a Project API Key and reveal its Secret once
      description: This credential-mint operation is non-idempotent and must not be retried automatically.
      security:
        - HumanAccessToken: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scopes, expires_at]
              properties:
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/ProjectApiKeyScope'
                expires_at:
                  oneOf:
                    - type: string
                      format: date-time
                    - type: 'null'
      responses:
        '201':
          description: The new metadata and its one-time Secret
          headers:
            Location:
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, api_key, secret]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  api_key: { $ref: '#/components/schemas/ProjectApiKeyMetadata' }
                  secret:
                    type: string
                    readOnly: true
                    x-sensitive: true
                    description: Returned only by the initial successful creation response.
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '403': { $ref: '#/components/responses/HumanForbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ApiKeyValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: listProjectApiKeys
      summary: List API Key metadata without Secrets
      security:
        - HumanAccessToken: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/OpaqueCursor'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Reverse-chronological API Key metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, api_keys, pagination]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  api_keys:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectApiKeyMetadata' }
                  pagination:
                    type: object
                    additionalProperties: false
                    required: [next_cursor, has_more, limit]
                    properties:
                      next_cursor:
                        oneOf:
                          - type: string
                          - type: 'null'
                      has_more: { type: boolean }
                      limit: { type: integer }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '403': { $ref: '#/components/responses/HumanForbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/api-keys/{key_id}:
    delete:
      operationId: revokeProjectApiKey
      summary: Revoke one API Key in the authenticated user's Project
      security:
        - HumanAccessToken: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: key_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '204':
          description: The API Key was revoked
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '403': { $ref: '#/components/responses/HumanForbidden' }
        '404': { $ref: '#/components/responses/ApiKeyNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/datasets:
    get:
      operationId: listDatasets
      summary: List the Project's datasets by name (requires results:read)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/NameCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Datasets in name order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, datasets, pagination]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  datasets:
                    type: array
                    items: { $ref: '#/components/schemas/Dataset' }
                  pagination: { $ref: '#/components/schemas/CursorPagination' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/datasets/{dataset_name}:
    get:
      operationId: getDataset
      summary: Read one dataset's metadata (requires results:read)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatasetName'
      responses:
        '200':
          description: The dataset
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, dataset]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  dataset: { $ref: '#/components/schemas/Dataset' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StorageNotFound' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/datasets/{dataset_name}/items:
    post:
      operationId: appendDatasetItems
      summary: Append JSON objects to a dataset, creating it on first use (requires tasks:write)
      description: >-
        Items are append-only and numbered 1..item_count in append order. A Job created with a
        dataset name also appends one result item to that dataset when it completes.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatasetName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: '#/components/schemas/JsonObject' }
      responses:
        '201':
          description: The dataset after the append
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, dataset, appended]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  dataset: { $ref: '#/components/schemas/Dataset' }
                  appended: { type: integer, minimum: 1 }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/StorageValidationFailed' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: listDatasetItems
      summary: Page through dataset items in append order (requires results:read)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatasetName'
        - $ref: '#/components/parameters/ItemOffset'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: Items after offset
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, items, pagination]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/JsonObject' }
                  pagination:
                    type: object
                    additionalProperties: false
                    required: [offset, limit, total, next_offset, has_more]
                    properties:
                      offset: { type: integer, minimum: 0 }
                      limit: { type: integer, minimum: 1 }
                      total: { type: integer, minimum: 0 }
                      next_offset: { type: integer, minimum: 0 }
                      has_more: { type: boolean }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StorageNotFound' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/datasets/{dataset_name}/export:
    get:
      operationId: exportDatasetItems
      summary: Export up to 10000 dataset items as JSON, JSON Lines or CSV (requires results:read)
      description: >-
        CSV has one column per top-level key in first-seen order; nested values are JSON-encoded.
        Page larger datasets with offset; X-Total-Count carries the dataset's item count.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatasetName'
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, jsonl, csv], default: json }
        - $ref: '#/components/parameters/ItemOffset'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10000, default: 10000 }
      responses:
        '200':
          description: The exported items as an attachment
          headers:
            X-Total-Count:
              schema: { type: integer, minimum: 0 }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JsonObject' }
            application/x-ndjson:
              schema: { type: string }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StorageNotFound' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/key-value-stores:
    get:
      operationId: listKeyValueStores
      summary: List the Project's key-value stores by name (requires results:read)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/NameCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Stores in name order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, key_value_stores, pagination]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  key_value_stores:
                    type: array
                    items: { $ref: '#/components/schemas/KeyValueStore' }
                  pagination: { $ref: '#/components/schemas/CursorPagination' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/key-value-stores/{store_name}/records:
    get:
      operationId: listKeyValueRecords
      summary: List record keys and metadata in key order (requires results:read)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/StoreName'
        - $ref: '#/components/parameters/NameCursor'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: Record metadata without values
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, records, pagination]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/KeyValueRecord' }
                  pagination: { $ref: '#/components/schemas/CursorPagination' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StorageNotFound' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/key-value-stores/{store_name}/records/{record_key}:
    get:
      operationId: getKeyValueRecord
      summary: Read a record's raw bytes with its stored Content-Type (requires results:read)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/StoreName'
        - $ref: '#/components/parameters/RecordKey'
      responses:
        '200':
          description: The record value
          headers:
            Last-Modified:
              schema: { type: string }
          content:
            '*/*':
              schema: { type: string, contentMediaType: application/octet-stream }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StorageNotFound' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: putKeyValueRecord
      summary: Store raw bytes under a key, creating the store on first use (requires tasks:write)
      description: >-
        The body is stored verbatim with the request Content-Type (application/octet-stream when
        absent). Records are limited by DIAOYAN_KV_MAX_RECORD_BYTES (default 1048576).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/StoreName'
        - $ref: '#/components/parameters/RecordKey'
      requestBody:
        required: true
        content:
          '*/*':
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        '200':
          description: The stored record's metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, record]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  record: { $ref: '#/components/schemas/KeyValueRecord' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/RecordTooLarge' }
        '422': { $ref: '#/components/responses/StorageValidationFailed' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteKeyValueRecord
      summary: Delete one record (requires tasks:write)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/StoreName'
        - $ref: '#/components/parameters/RecordKey'
      responses:
        '204':
          description: The record was deleted
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StorageNotFound' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/schedules:
    post:
      operationId: createJobSchedule
      summary: Create a cron schedule that creates a Job from a stored request (requires tasks:write)
      description: >-
        cron is a five-field expression (minute hour day-of-month month day-of-week) evaluated in
        UTC. Each firing creates one Job with Idempotency-Key schedule:<id>:<slot>, so a slot fires
        at most once across control-plane instances; slots missed while down or disabled are skipped.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, cron, job]
              properties:
                name: { $ref: '#/components/schemas/StorageName' }
                cron: { type: string, minLength: 1, maxLength: 128, examples: ['*/15 * * * *'] }
                job: { $ref: '#/components/schemas/CreateJobRequest' }
                enabled: { type: boolean, default: true }
      responses:
        '201':
          description: The new schedule
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobScheduleResponse' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/StorageValidationFailed' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: listJobSchedules
      summary: List the Project's schedules by name (requires results:read)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: All schedules in the Project
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, schedules]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  schedules:
                    type: array
                    items: { $ref: '#/components/schemas/JobSchedule' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/schedules/{schedule_id}:
    get:
      operationId: getJobSchedule
      summary: Read one schedule, including its last firing (requires results:read)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200':
          description: The schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobScheduleResponse' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScheduleNotFound' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteJobSchedule
      summary: Delete a schedule; Jobs it already created are kept (requires tasks:write)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '204':
          description: The schedule was deleted
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScheduleNotFound' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/schedules/{schedule_id}/enable:
    post:
      operationId: enableJobSchedule
      summary: Enable a schedule from its next future slot (requires tasks:write)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The enabled schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobScheduleResponse' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScheduleNotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/StorageValidationFailed' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/schedules/{schedule_id}/disable:
    post:
      operationId: disableJobSchedule
      summary: Stop a schedule from firing (requires tasks:write)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The disabled schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobScheduleResponse' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScheduleNotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/StorageValidationFailed' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/usage:
    get:
      operationId: getProjectUsage
      summary: Summarize metered usage for one Project and its Organization credit balance
      description: >-
        Usage is metered when a Job completes: page_read and browser_read per page a read Job
        fetched over HTTP or a browser, crawl_page per page of a crawl Job, and search_query per
        search Job. Credits are priced from the control plane's configured price table at
        completion time; without a price table usage is still metered at zero credits.
        Requires the results:read scope.
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: month
          in: query
          required: false
          description: UTC calendar month to summarize. Defaults to the current month.
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: Per-meter usage totals and the current Organization credit balance
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, usage, credits]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  usage: { $ref: '#/components/schemas/ProjectUsage' }
                  credits:
                    type: object
                    additionalProperties: false
                    required: [organization_id, balance_credits, billing_enabled]
                    properties:
                      organization_id: { $ref: '#/components/schemas/Uuid' }
                      balance_credits: { type: integer }
                      billing_enabled: { type: boolean }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BillingDisabled' }
  /organizations/{organization_id}/billing:
    get:
      operationId: getOrganizationBilling
      summary: Read the Organization credit balance, price table and checkout availability
      security:
        - HumanAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization billing state visible to any member
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, billing]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  billing: { $ref: '#/components/schemas/OrganizationBilling' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '404': { $ref: '#/components/responses/OrganizationNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /organizations/{organization_id}/billing/checkout-sessions:
    post:
      operationId: createCreditCheckoutSession
      summary: Start a Stripe Checkout Session that buys one configured credit pack
      description: >-
        Owners and admins only. Credits are added when Stripe reports the session paid through
        the webhook, not when this call returns. The control plane accepts Stripe test-mode keys only.
      security:
        - HumanAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pack_id]
              properties:
                pack_id: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '201':
          description: The Stripe-hosted Checkout URL to send the buyer to
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, checkout_session]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  checkout_session: { $ref: '#/components/schemas/CreditCheckoutSession' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '403': { $ref: '#/components/responses/HumanOrganizationForbidden' }
        '404': { $ref: '#/components/responses/OrganizationNotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/BillingValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/PaymentProviderError' }
        '503': { $ref: '#/components/responses/BillingDisabled' }
  /billing/stripe/webhook:
    post:
      operationId: receiveStripeWebhook
      summary: Receive Stripe webhook events that credit paid Checkout Sessions
      description: >-
        Authenticated by the Stripe-Signature header (v1 HMAC-SHA256, 300 second tolerance).
        Each event id is applied at most once; redeliveries return duplicate true. Only
        checkout.session.completed and checkout.session.async_payment_succeeded with
        payment_status paid credit the Organization that created the session.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JsonObject' }
      responses:
        '200':
          description: The event was verified and applied, ignored, or recognized as a duplicate
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [received, duplicate, credited_credits]
                properties:
                  received: { type: boolean, const: true }
                  duplicate: { type: boolean }
                  credited_credits: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/BillingValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BillingDisabled' }
components:
  securitySchemes:
    ProjectApiKey:
      type: http
      scheme: bearer
      bearerFormat: dya_live
      description: Project API Key with the tasks:write scope.
    HumanAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived human Access Token issued after OIDC Authorization Code + PKCE.
    HumanRefreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-diaoyan_refresh
      description: Rotating Secure HttpOnly SameSite=Strict refresh token scoped to /v1/auth/refresh.
  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    DatasetName:
      name: dataset_name
      in: path
      required: true
      schema: { $ref: '#/components/schemas/StorageName' }
    StoreName:
      name: store_name
      in: path
      required: true
      schema: { $ref: '#/components/schemas/StorageName' }
    RecordKey:
      name: record_key
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9!._'()*-]{1,256}$" }
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    NameCursor:
      name: cursor
      in: query
      required: false
      description: The next_cursor of the previous page (the last name or key it returned).
      schema: { type: string, minLength: 1, maxLength: 256 }
    ItemOffset:
      name: offset
      in: query
      required: false
      description: Number of items to skip; items are numbered 1..item_count in append order.
      schema: { type: integer, minimum: 0, default: 0 }
    OpaqueCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[A-Za-z0-9_-]+$'
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  headers:
    NoStore:
      schema: { type: string, const: no-store }
    NoCache:
      schema: { type: string, const: no-cache }
    RetryAfter:
      description: Whole seconds until another attempt may be made.
      schema: { type: integer, minimum: 1 }
  schemas:
    Uuid:
      type: string
      format: uuid
    OidcState:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    HumanAccessTokenResponse:
      type: object
      additionalProperties: false
      required: [request_id, token_type, access_token, access_token_expires_at]
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        token_type: { type: string, const: Bearer }
        access_token:
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          x-sensitive: true
          description: Short-lived token intended for in-memory storage only.
        access_token_expires_at: { type: string, format: date-time }
    HumanLoginResponse:
      type: object
      additionalProperties: false
      required: [request_id, token_type, access_token, access_token_expires_at, user]
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        token_type: { type: string, const: Bearer }
        access_token:
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          x-sensitive: true
          description: Short-lived token intended for in-memory storage only.
        access_token_expires_at: { type: string, format: date-time }
        user:
          type: object
          additionalProperties: false
          required: [id, email, display_name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            email:
              oneOf: [{ type: string }, { type: 'null' }]
            display_name:
              oneOf: [{ type: string }, { type: 'null' }]
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, slug, name, kind, role, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        kind: { type: string, enum: [personal, business] }
        role: { type: string, enum: [owner, admin, member] }
        created_at: { type: string, format: date-time }
    ProjectSummary:
      type: object
      additionalProperties: false
      required: [id, organization_id, slug, name, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        organization_id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    CursorPagination:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more, limit]
      properties:
        next_cursor:
          oneOf: [{ type: string }, { type: 'null' }]
        has_more: { type: boolean }
        limit: { type: integer, minimum: 1, maximum: 100 }
    JsonObject:
      type: object
      additionalProperties: true
    PublicHttpUrl:
      type: string
      format: uri
      pattern: '^https?://[^/?#@\s]+(?:[/?#][^\s]*)?$'
      description: Exact lowercase HTTP or HTTPS URL without whitespace or user information.
    BrowserReadiness:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: object
          additionalProperties: false
          required: [selector]
          properties:
            selector: { type: string, minLength: 1, maxLength: 512, pattern: '\S' }
            state: { type: string, enum: [attached, visible] }
            minCount: { type: integer, minimum: 1, maximum: 10000 }
        interaction:
          type: object
          additionalProperties: false
          required: [type, maxSteps]
          properties:
            type: { type: string, const: scroll-to-end }
            maxSteps: { type: integer, minimum: 1, maximum: 100 }
            stepDelayMs: { type: integer, minimum: 0, maximum: 5000 }
        timeoutMs: { type: integer, minimum: 100, maximum: 120000 }
    ReadJobInput:
      type: object
      additionalProperties: false
      required: [url]
      not:
        required: [browserAllowed, browserReadiness]
        properties:
          browserAllowed: { const: false }
      properties:
        url: { $ref: '#/components/schemas/PublicHttpUrl' }
        browserAllowed: { type: boolean }
        cacheMode: { type: string, enum: [prefer-cache, live, cache-only] }
        maxAgeSeconds: { type: integer, minimum: 1, maximum: 9007199254740991 }
        browserReadiness: { $ref: '#/components/schemas/BrowserReadiness' }
    MapJobInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { $ref: '#/components/schemas/PublicHttpUrl' }
        browserAllowed: { type: boolean }
        maxPages: { type: integer, minimum: 1, maximum: 500 }
        maxDepth: { type: integer, minimum: 0, maximum: 10 }
        includeSubdomains: { type: boolean }
        ignoreQueryParameters: { type: boolean }
    CrawlJobInput:
      type: object
      additionalProperties: false
      required: [url]
      not:
        required: [browserAllowed, browserReadiness]
        properties:
          browserAllowed: { const: false }
      properties:
        url: { $ref: '#/components/schemas/PublicHttpUrl' }
        browserAllowed: { type: boolean }
        cacheMode: { type: string, enum: [prefer-cache, live, cache-only] }
        maxAgeSeconds: { type: integer, minimum: 1, maximum: 9007199254740991 }
        browserReadiness: { $ref: '#/components/schemas/BrowserReadiness' }
        maxPages: { type: integer, minimum: 1, maximum: 10000 }
        maxDepth: { type: integer, minimum: 0, maximum: 10 }
        includeSubdomains: { type: boolean }
        ignoreQueryParameters: { type: boolean }
        concurrency: { type: integer, minimum: 1, maximum: 32 }
    SearchJobInput:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 512, pattern: '\S' }
        limit: { type: integer, minimum: 1, maximum: 20 }
        page: { type: integer, minimum: 1, maximum: 100 }
        language:
          type: string
          pattern: '^(?:all|[A-Za-z]{2,3}(?:[-_][A-Za-z0-9]{2,8})?)$'
        safeSearch: { type: integer, enum: [0, 1, 2] }
        timeRange: { type: string, enum: [day, month, year] }
        source: { type: string, enum: [auto, local, web] }
    ControlPlaneRequiredCapabilities:
      type: object
      additionalProperties: false
      properties:
        http: { type: boolean, const: true }
        browser: { type: boolean, const: true }
        pdf: { type: boolean, const: true }
        feed: { type: boolean, const: true }
    ProjectApiKeyScope:
      type: string
      enum: ['tasks:write', 'results:read', 'project:admin']
    ProjectApiKeyMetadata:
      type: object
      additionalProperties: false
      required:
        - id
        - display_prefix
        - scopes
        - created_by_user_id
        - created_at
        - last_used_at
        - expires_at
        - revoked_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        display_prefix: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ProjectApiKeyScope' }
        created_by_user_id: { $ref: '#/components/schemas/Uuid' }
        created_at: { type: string, format: date-time }
        last_used_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        revoked_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    CreateJobRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - input
        - data_class
        - placement
        - required_capabilities
        - budget
        - policy_version
        - upload_private_artifact
      properties:
        type:
          type: string
          enum: [read]
          description: Only Job types a released Worker can execute are accepted; others return 422 JOB_REQUEST_INVALID.
        input:
          $ref: '#/components/schemas/ReadJobInput'
        data_class:
          type: string
          enum: [public]
        placement:
          type: object
          additionalProperties: false
          required: [class, pinned_worker_id]
          properties:
            class:
              type: string
              enum: [public]
            pinned_worker_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
        required_capabilities:
          $ref: '#/components/schemas/ControlPlaneRequiredCapabilities'
        budget:
          type: object
          additionalProperties: false
          required:
            - deadline_ms
            - max_provider_attempts
            - max_document_bytes
            - max_browser_ms
            - max_browser_contexts
          properties:
            deadline_ms:
              type: integer
              minimum: 1
              maximum: 86400000
            max_provider_attempts:
              type: integer
              minimum: 1
              maximum: 1000000
            max_document_bytes:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            max_browser_ms:
              type: integer
              minimum: 0
              maximum: 86400000
            max_browser_contexts:
              type: integer
              minimum: 0
              maximum: 100000
        policy_version:
          type: string
          minLength: 1
          maxLength: 256
        upload_private_artifact:
          type: boolean
        priority:
          type: integer
          minimum: -100
          maximum: 100
          default: 0
        not_before:
          type: string
          format: date-time
        dataset:
          $ref: '#/components/schemas/StorageName'
          description: >-
            Project dataset (created on demand) that receives one result item with the Job URL,
            HTTP status and Artifact reference when the Job completes.
    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - input
        - data_class
        - placement
        - required_capabilities
        - budget
        - policy_version
        - upload_private_artifact
        - priority
        - not_before
        - deadline_at
        - status
        - result_completeness
        - error_code
        - dataset_id
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum: [read, inspect, map, crawl, search]
        input:
          $ref: '#/components/schemas/JsonObject'
        data_class:
          type: string
          enum: [public, authorized, intranet]
        placement:
          type: object
          additionalProperties: false
          required: [class, pinned_worker_id]
          properties:
            class:
              type: string
              enum: [public, private]
            pinned_worker_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
        required_capabilities:
          $ref: '#/components/schemas/ControlPlaneRequiredCapabilities'
        budget:
          type: object
          additionalProperties: false
          required:
            - deadline_ms
            - max_provider_attempts
            - max_document_bytes
            - max_browser_ms
            - max_browser_contexts
          properties:
            deadline_ms: { type: integer, minimum: 1, maximum: 86400000 }
            max_provider_attempts: { type: integer, minimum: 1, maximum: 1000000 }
            max_document_bytes: { type: integer, minimum: 1, maximum: 9007199254740991 }
            max_browser_ms: { type: integer, minimum: 0, maximum: 86400000 }
            max_browser_contexts: { type: integer, minimum: 0, maximum: 100000 }
        policy_version:
          type: string
        upload_private_artifact:
          type: boolean
        priority:
          type: integer
        not_before:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [accepted, queued, assigned, running, paused, completed, failed, cancelled]
        result_completeness:
          oneOf:
            - type: string
              enum: [complete, partial]
            - type: 'null'
        error_code:
          oneOf:
            - type: string
            - type: 'null'
        dataset_id:
          description: Output dataset of the Job, if any.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
      allOf:
        - oneOf:
            - properties:
                type: { const: read }
                input: { $ref: '#/components/schemas/ReadJobInput' }
            - properties:
                type: { const: inspect }
                input: { $ref: '#/components/schemas/ReadJobInput' }
            - properties:
                type: { const: map }
                input: { $ref: '#/components/schemas/MapJobInput' }
            - properties:
                type: { const: crawl }
                input: { $ref: '#/components/schemas/CrawlJobInput' }
            - properties:
                type: { const: search }
                input: { $ref: '#/components/schemas/SearchJobInput' }
    Publication:
      type: object
      additionalProperties: false
      required:
        - id
        - job_id
        - lease_id
        - lease_generation
        - local_sequence
        - sequence
        - completeness
        - recorded_at
        - artifact
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        job_id: { $ref: '#/components/schemas/Uuid' }
        lease_id: { $ref: '#/components/schemas/Uuid' }
        lease_generation: { type: integer, minimum: 1 }
        local_sequence: { type: integer, minimum: 1 }
        sequence: { type: integer, minimum: 1 }
        completeness: { type: string, enum: [complete, partial] }
        recorded_at: { type: string, format: date-time }
        artifact:
          type: object
          additionalProperties: false
          required: [id, version, content_hash, byte_count, media_type, storage, object_key, created_at]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            version: { type: integer, minimum: 1 }
            content_hash: { type: string }
            byte_count: { type: integer, minimum: 0 }
            media_type: { type: string }
            storage: { type: string, enum: [worker_local, cloud_object] }
            object_key:
              oneOf:
                - type: string
                - type: 'null'
            created_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - actor_type
        - actor_id
        - action
        - target_type
        - target_id
        - outcome
        - correlation_id
        - occurred_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        actor_type: { type: string, enum: [user, api_key, worker] }
        actor_id: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        outcome: { type: string, enum: [succeeded, failed] }
        correlation_id: { type: string }
        occurred_at: { type: string, format: date-time }
    WebhookEventType:
      type: string
      enum: [job.completed, job.failed, job.cancelled]
    WebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, event_types, status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        url: { type: string, format: uri }
        event_types:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
    WebhookDelivery:
      type: object
      additionalProperties: false
      required:
        - id
        - event_id
        - endpoint_id
        - event_type
        - status
        - attempt_count
        - next_attempt_at
        - last_status_code
        - last_error
        - created_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        event_id: { $ref: '#/components/schemas/Uuid' }
        endpoint_id: { $ref: '#/components/schemas/Uuid' }
        event_type: { $ref: '#/components/schemas/WebhookEventType' }
        status: { type: string, enum: [pending, succeeded, dead_letter] }
        attempt_count: { type: integer, minimum: 0 }
        next_attempt_at: { type: string, format: date-time }
        last_status_code:
          oneOf:
            - type: integer
            - type: 'null'
        last_error:
          oneOf:
            - type: string
            - type: 'null'
        created_at: { type: string, format: date-time }
    StorageName:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    Dataset:
      type: object
      additionalProperties: false
      required: [id, name, item_count, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/StorageName' }
        item_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    KeyValueStore:
      type: object
      additionalProperties: false
      required: [id, name, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/StorageName' }
        created_at: { type: string, format: date-time }
    KeyValueRecord:
      type: object
      additionalProperties: false
      required: [key, content_type, byte_count, updated_at]
      properties:
        key: { type: string }
        content_type: { type: string }
        byte_count: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    JobSchedule:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - cron
        - timezone
        - job
        - enabled
        - next_fire_at
        - last_fired_at
        - last_job_id
        - last_error_code
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/StorageName' }
        cron: { type: string }
        timezone: { type: string, const: UTC }
        job: { $ref: '#/components/schemas/CreateJobRequest' }
        enabled: { type: boolean }
        next_fire_at: { type: string, format: date-time }
        last_fired_at:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        last_job_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        last_error_code:
          description: Problem code of the last firing that could not create a Job, such as QUOTA_EXCEEDED.
          oneOf:
            - type: string
            - type: 'null'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JobScheduleResponse:
      type: object
      additionalProperties: false
      required: [request_id, schedule]
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        schedule: { $ref: '#/components/schemas/JobSchedule' }
    BillingMeter:
      type: string
      enum: [page_read, browser_read, crawl_page, search_query]
    ProjectUsage:
      type: object
      additionalProperties: false
      required: [project_id, period_start, period_end, meters, total_credits]
      properties:
        project_id: { $ref: '#/components/schemas/Uuid' }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        meters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [meter, quantity, credits]
            properties:
              meter: { $ref: '#/components/schemas/BillingMeter' }
              quantity: { type: integer, minimum: 0 }
              credits: { type: integer, minimum: 0 }
        total_credits: { type: integer, minimum: 0 }
    BillingPriceTable:
      type: object
      additionalProperties: false
      required: [currency, meters, credit_packs]
      properties:
        currency: { type: string, pattern: '^[a-z]{3}$' }
        meters:
          type: object
          additionalProperties: false
          required: [page_read, browser_read, crawl_page, search_query]
          properties:
            page_read: { type: integer, minimum: 0 }
            browser_read: { type: integer, minimum: 0 }
            crawl_page: { type: integer, minimum: 0 }
            search_query: { type: integer, minimum: 0 }
        credit_packs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, credits, amount]
            properties:
              id: { type: string }
              name: { type: string }
              credits: { type: integer, minimum: 1 }
              amount:
                type: integer
                minimum: 1
                description: Price in the currency's minor unit, for example cents.
    OrganizationBilling:
      type: object
      additionalProperties: false
      required: [organization_id, balance_credits, checkout_enabled, prices]
      properties:
        organization_id: { $ref: '#/components/schemas/Uuid' }
        balance_credits:
          type: integer
          description: Prepaid credits. Usage of Jobs already running may take it below zero.
        checkout_enabled: { type: boolean }
        prices:
          oneOf:
            - $ref: '#/components/schemas/BillingPriceTable'
            - type: 'null'
    CreditCheckoutSession:
      type: object
      additionalProperties: false
      required: [id, url, pack_id, credits, amount, currency]
      properties:
        id: { type: string, pattern: '^cs_' }
        url: { type: string, format: uri }
        pack_id: { type: string }
        credits: { type: integer, minimum: 1 }
        amount: { type: integer, minimum: 1 }
        currency: { type: string }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, request_id, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        request_id: { $ref: '#/components/schemas/Uuid' }
        retryable: { type: boolean }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
  responses:
    HumanAuthBadRequest:
      description: Authentication query, headers, or body are malformed
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanAuthUnauthorized:
      description: OIDC state, Provider result, or refresh credential is invalid
      headers:
        Set-Cookie:
          description: May clear the invalid state or refresh cookie.
          schema: { type: string }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanAccessTokenUnauthorized:
      description: The human Access Token is missing, invalid, expired, or revoked
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanAuthRateLimited:
      description: Too many anonymous OIDC login attempts
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RefreshRotationConflict:
      description: Another request already rotated this refresh token during the grace window
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanAuthInternalError:
      description: The authentication request could not be completed
      headers:
        Set-Cookie:
          description: Callback failures may clear the state cookie.
          schema: { type: string }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanOrganizationForbidden:
      description: The Organization member lacks the owner or admin role required to create a Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OrganizationNotFound:
      description: The Organization is absent or hidden because the user has no membership
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProjectCreationConflict:
      description: >-
        The Organization already has this Project slug, or the Idempotency-Key is bound to
        a different request payload.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProjectValidationFailed:
      description: The Project creation request violates the contract
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MalformedRequest:
      description: A required header or request syntax is malformed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: The Project API Key is missing, invalid, expired, or revoked
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The API Key lacks scope or is bound to a different Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanUnauthorized:
      description: The human Access Token is missing, invalid, expired, or revoked
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanForbidden:
      description: The authenticated user is not an owner or admin of this Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ApiKeyNotFound:
      description: The API Key does not exist in the authenticated Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ApiKeyValidationFailed:
      description: The API Key creation request violates the contract
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyConflict:
      description: The Idempotency-Key is bound to a different request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    JobNotFound:
      description: The Job does not exist in the authenticated Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    JobTransitionConflict:
      description: The Job is missing from the Project or cannot perform the requested transition
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: { const: 409 }
    PayloadTooLarge:
      description: The request body exceeds 65536 bytes
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: The request is not application/json
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: The Job request body violates the contract
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ArtifactNotFound:
      description: The cloud Artifact does not exist in this Project or has not been uploaded
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ArtifactStorageDisabled:
      description: Cloud Artifact storage is not configured on this control plane
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WebhooksDisabled:
      description: Webhooks are disabled because no webhook encryption key is configured
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WebhookNotFound:
      description: The webhook endpoint or event does not exist in this Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    QuotaExceeded:
      description: >-
        A Project quota or the per-API-key request rate is exhausted. Retry-After is present and
        retryable is true only when the limit resets with time.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    StorageNotFound:
      description: The dataset, key-value store or record does not exist in this Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    StorageValidationFailed:
      description: The storage or schedule request violates the contract
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RecordTooLarge:
      description: The record exceeds the configured key-value record limit
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ScheduleNotFound:
      description: The schedule does not exist in this Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ScheduleConflict:
      description: A schedule with this name already exists in the Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CreditsExhausted:
      description: >-
        The Organization's prepaid credit balance cannot cover the minimum charge of this Job
        (code CREDITS_EXHAUSTED). Buy credits, then retry with the same Idempotency-Key.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BillingDisabled:
      description: Usage metering, a price table, or Stripe checkout is not configured on this control plane
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BillingValidationFailed:
      description: The credit pack is unknown, or a paid Checkout Session does not match its recorded price
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PaymentProviderError:
      description: Stripe rejected or failed the Checkout Session request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: The request could not be completed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

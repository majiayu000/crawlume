openapi: 3.2.0
info:
  title: Diaoyan Project Control API
  version: 1.0.0
  description: Project-scoped API for server integrations and authenticated human administrators.
servers:
  - url: https://control.example/v1
security:
  - ProjectApiKey: []
x-max-body-bytes: 65536
paths:
  /auth/oidc/begin:
    get:
      operationId: beginHumanOidcLogin
      summary: Begin an OIDC Authorization Code + PKCE login
      description: Creates one bounded login attempt. No request body or query parameters are accepted.
      security: []
      responses:
        '302':
          description: Redirect to the configured OIDC Provider
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              description: Secure HttpOnly SameSite=Lax state cookie scoped to the callback path.
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
        '400': { $ref: '#/components/responses/HumanAuthBadRequest' }
        '429': { $ref: '#/components/responses/HumanAuthRateLimited' }
        '500': { $ref: '#/components/responses/HumanAuthInternalError' }
  /auth/oidc/callback:
    get:
      operationId: completeHumanOidcLogin
      summary: Complete an OIDC login and establish a human session
      description: >-
        Requires exactly one state plus either one authorization code or one Provider error.
        Provider error details are never reflected in the response.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { $ref: '#/components/schemas/OidcState' }
        - name: code
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: error
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: error_description
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: error_uri
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: __Secure-diaoyan_oidc_state
          in: cookie
          required: true
          description: Secure HttpOnly SameSite=Lax browser binding; must equal the state query value.
          schema: { $ref: '#/components/schemas/OidcState' }
      responses:
        '200':
          description: Login completed; keep the Access Token in memory only
          headers:
            Set-Cookie:
              description: Clears the state cookie and sets the rotated Secure HttpOnly refresh cookie.
              schema:
                type: array
                items: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanLoginResponse' }
        '400': { $ref: '#/components/responses/HumanAuthBadRequest' }
        '401': { $ref: '#/components/responses/HumanAuthUnauthorized' }
        '500': { $ref: '#/components/responses/HumanAuthInternalError' }
  /auth/refresh:
    post:
      operationId: refreshHumanSession
      summary: Rotate the HttpOnly refresh cookie and issue a new Access Token
      description: Accepts no request body or query parameters.
      security:
        - HumanRefreshCookie: []
      responses:
        '200':
          description: Refresh rotation completed; keep the Access Token in memory only
          headers:
            Set-Cookie:
              description: Rotated Secure HttpOnly SameSite=Strict cookie scoped to /v1/auth/refresh.
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanAccessTokenResponse' }
        '400': { $ref: '#/components/responses/HumanAuthBadRequest' }
        '401': { $ref: '#/components/responses/HumanAuthUnauthorized' }
        '409': { $ref: '#/components/responses/RefreshRotationConflict' }
        '500': { $ref: '#/components/responses/HumanAuthInternalError' }
  /auth/logout:
    post:
      operationId: logoutHumanSession
      summary: Revoke every refresh session for the authenticated user
      description: Accepts no request body or query parameters.
      security:
        - HumanAccessToken: []
      responses:
        '204':
          description: Sessions revoked and the refresh cookie cleared
          headers:
            Set-Cookie:
              description: Expires the refresh cookie at /v1/auth/refresh.
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
        '400': { $ref: '#/components/responses/HumanAuthBadRequest' }
        '401': { $ref: '#/components/responses/HumanAccessTokenUnauthorized' }
        '500': { $ref: '#/components/responses/HumanAuthInternalError' }
  /organizations:
    get:
      operationId: listOrganizations
      summary: List Organizations visible to the authenticated user
      security:
        - HumanAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OpaqueCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Reverse-chronological Organization memberships
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, organizations, pagination]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  organizations:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizationSummary' }
                  pagination: { $ref: '#/components/schemas/CursorPagination' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /organizations/{organization_id}/projects:
    get:
      operationId: listOrganizationProjects
      summary: List Projects in one Organization membership
      security:
        - HumanAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OpaqueCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Reverse-chronological Projects in the Organization
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, projects, pagination]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectSummary' }
                  pagination: { $ref: '#/components/schemas/CursorPagination' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '404': { $ref: '#/components/responses/OrganizationNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createOrganizationProject
      summary: Create or idempotently replay a Project in an Organization
      security:
        - HumanAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name]
              properties:
                slug: { type: string, minLength: 1, pattern: '\S' }
                name: { type: string, minLength: 1, pattern: '\S' }
      responses:
        '201':
          description: Newly created Project or the original Project for an identical replay
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, project]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  project: { $ref: '#/components/schemas/ProjectSummary' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '403': { $ref: '#/components/responses/HumanOrganizationForbidden' }
        '404': { $ref: '#/components/responses/OrganizationNotFound' }
        '409': { $ref: '#/components/responses/ProjectCreationConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ProjectValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/jobs:
    post:
      operationId: createProjectJob
      summary: Create or idempotently replay a Project Job
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: The newly created Job or the original Job for an identical replay
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, job]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  job:
                    $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/jobs/{job_id}:
    get:
      operationId: getProjectJob
      summary: Read one Job from the API Key's Project
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The Project-scoped Job
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, job]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  job:
                    $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/jobs/{job_id}/pause:
    post:
      operationId: pauseProjectJob
      summary: Idempotently pause a queued or active Project Job
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The paused Job, including an idempotent replay
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, job]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  job:
                    allOf:
                      - $ref: '#/components/schemas/Job'
                      - type: object
                        properties:
                          status: { const: paused }
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/JobTransitionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/jobs/{job_id}/resume:
    post:
      operationId: resumeProjectJob
      summary: Idempotently return a paused Project Job to the queue
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The queued Job, including an idempotent replay
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, job]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  job:
                    allOf:
                      - $ref: '#/components/schemas/Job'
                      - type: object
                        properties:
                          status: { const: queued }
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/JobTransitionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/jobs/{job_id}/cancel:
    post:
      operationId: cancelProjectJob
      summary: Idempotently cancel a non-terminal Project Job and its active Lease
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The cancelled Job, including an idempotent replay
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, job]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  job:
                    $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/JobTransitionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/jobs/{job_id}/publications:
    get:
      operationId: listProjectJobPublications
      summary: List Artifact publications for one Project Job
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: job_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Sequence-ordered Project publications
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, publications, pagination]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  publications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Publication'
                  pagination:
                    type: object
                    additionalProperties: false
                    required: [next_sequence, has_more, limit]
                    properties:
                      next_sequence:
                        oneOf:
                          - type: integer
                            minimum: 1
                          - type: 'null'
                      has_more:
                        type: boolean
                      limit:
                        type: integer
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/webhook-endpoints:
    post:
      operationId: createWebhookEndpoint
      summary: Register a signed webhook endpoint; the secret is returned only once
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, event_types]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: Public https URL; private and loopback targets are rejected.
                event_types:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/WebhookEventType'
      responses:
        '201':
          description: The new endpoint and its whsec_ signing secret
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, endpoint, secret]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  endpoint:
                    $ref: '#/components/schemas/WebhookEndpoint'
                  secret:
                    type: string
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/WebhooksDisabled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listWebhookEndpoints
      summary: List the Project's webhook endpoints
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Up to 100 endpoints, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, endpoints]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  endpoints:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/webhook-endpoints/{endpoint_id}:
    delete:
      operationId: disableWebhookEndpoint
      summary: Disable an endpoint; its pending deliveries become dead letters
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: endpoint_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: The endpoint is disabled
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/webhook-endpoints/{endpoint_id}/rotate-secret:
    post:
      operationId: rotateWebhookEndpointSecret
      summary: Issue a new secret; deliveries are signed with both secrets for 24 hours
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: endpoint_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The new whsec_ signing secret
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, secret]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  secret:
                    type: string
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/WebhooksDisabled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/webhook-events/{event_id}/redeliver:
    post:
      operationId: redeliverWebhookEvent
      summary: Queue a new delivery of an event to every active subscribed endpoint
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: event_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '202':
          description: The number of deliveries queued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, queued]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  queued:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/WebhookNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/WebhooksDisabled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List recent webhook deliveries, newest first
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Recent deliveries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, deliveries]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/artifacts/{artifact_id}/download:
    get:
      operationId: getProjectArtifactDownload
      summary: Get a 5-minute presigned download URL for an uploaded cloud Artifact
      description: Requires results:read. Every issued URL is recorded as an artifact.downloaded audit event.
      security:
        - ProjectApiKey: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: artifact_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Short-lived download URL
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, url, expires_at]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ArtifactNotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ArtifactStorageDisabled'
  /projects/{project_id}/audit-events:
    get:
      operationId: listProjectAuditEvents
      summary: List append-only audit events for one Project
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Reverse-chronological Project audit events
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, audit_events, pagination]
                properties:
                  request_id:
                    $ref: '#/components/schemas/Uuid'
                  audit_events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  pagination:
                    type: object
                    additionalProperties: false
                    required: [next_cursor, has_more, limit]
                    properties:
                      next_cursor:
                        oneOf:
                          - type: string
                          - type: 'null'
                      has_more: { type: boolean }
                      limit: { type: integer }
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{project_id}/api-keys:
    post:
      operationId: createProjectApiKey
      summary: Create a Project API Key and reveal its Secret once
      description: This credential-mint operation is non-idempotent and must not be retried automatically.
      security:
        - HumanAccessToken: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scopes, expires_at]
              properties:
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/ProjectApiKeyScope'
                expires_at:
                  oneOf:
                    - type: string
                      format: date-time
                    - type: 'null'
      responses:
        '201':
          description: The new metadata and its one-time Secret
          headers:
            Location:
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, api_key, secret]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  api_key: { $ref: '#/components/schemas/ProjectApiKeyMetadata' }
                  secret:
                    type: string
                    readOnly: true
                    x-sensitive: true
                    description: Returned only by the initial successful creation response.
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '403': { $ref: '#/components/responses/HumanForbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ApiKeyValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: listProjectApiKeys
      summary: List API Key metadata without Secrets
      security:
        - HumanAccessToken: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/OpaqueCursor'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Reverse-chronological API Key metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, api_keys, pagination]
                properties:
                  request_id: { $ref: '#/components/schemas/Uuid' }
                  api_keys:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectApiKeyMetadata' }
                  pagination:
                    type: object
                    additionalProperties: false
                    required: [next_cursor, has_more, limit]
                    properties:
                      next_cursor:
                        oneOf:
                          - type: string
                          - type: 'null'
                      has_more: { type: boolean }
                      limit: { type: integer }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '403': { $ref: '#/components/responses/HumanForbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{project_id}/api-keys/{key_id}:
    delete:
      operationId: revokeProjectApiKey
      summary: Revoke one API Key in the authenticated user's Project
      security:
        - HumanAccessToken: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: key_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '204':
          description: The API Key was revoked
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/HumanUnauthorized' }
        '403': { $ref: '#/components/responses/HumanForbidden' }
        '404': { $ref: '#/components/responses/ApiKeyNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    ProjectApiKey:
      type: http
      scheme: bearer
      bearerFormat: dya_live
      description: Project API Key with the tasks:write scope.
    HumanAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived human Access Token issued after OIDC Authorization Code + PKCE.
    HumanRefreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-diaoyan_refresh
      description: Rotating Secure HttpOnly SameSite=Strict refresh token scoped to /v1/auth/refresh.
  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    OpaqueCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[A-Za-z0-9_-]+$'
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  headers:
    NoStore:
      schema: { type: string, const: no-store }
    NoCache:
      schema: { type: string, const: no-cache }
    RetryAfter:
      description: Whole seconds until another attempt may be made.
      schema: { type: integer, minimum: 1 }
  schemas:
    Uuid:
      type: string
      format: uuid
    OidcState:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    HumanAccessTokenResponse:
      type: object
      additionalProperties: false
      required: [request_id, token_type, access_token, access_token_expires_at]
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        token_type: { type: string, const: Bearer }
        access_token:
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          x-sensitive: true
          description: Short-lived token intended for in-memory storage only.
        access_token_expires_at: { type: string, format: date-time }
    HumanLoginResponse:
      type: object
      additionalProperties: false
      required: [request_id, token_type, access_token, access_token_expires_at, user]
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        token_type: { type: string, const: Bearer }
        access_token:
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          x-sensitive: true
          description: Short-lived token intended for in-memory storage only.
        access_token_expires_at: { type: string, format: date-time }
        user:
          type: object
          additionalProperties: false
          required: [id, email, display_name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            email:
              oneOf: [{ type: string }, { type: 'null' }]
            display_name:
              oneOf: [{ type: string }, { type: 'null' }]
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, slug, name, kind, role, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        kind: { type: string, enum: [personal, business] }
        role: { type: string, enum: [owner, admin, member] }
        created_at: { type: string, format: date-time }
    ProjectSummary:
      type: object
      additionalProperties: false
      required: [id, organization_id, slug, name, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        organization_id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    CursorPagination:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more, limit]
      properties:
        next_cursor:
          oneOf: [{ type: string }, { type: 'null' }]
        has_more: { type: boolean }
        limit: { type: integer, minimum: 1, maximum: 100 }
    JsonObject:
      type: object
      additionalProperties: true
    PublicHttpUrl:
      type: string
      format: uri
      pattern: '^https?://[^/?#@\s]+(?:[/?#][^\s]*)?$'
      description: Exact lowercase HTTP or HTTPS URL without whitespace or user information.
    BrowserReadiness:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: object
          additionalProperties: false
          required: [selector]
          properties:
            selector: { type: string, minLength: 1, maxLength: 512, pattern: '\S' }
            state: { type: string, enum: [attached, visible] }
            minCount: { type: integer, minimum: 1, maximum: 10000 }
        interaction:
          type: object
          additionalProperties: false
          required: [type, maxSteps]
          properties:
            type: { type: string, const: scroll-to-end }
            maxSteps: { type: integer, minimum: 1, maximum: 100 }
            stepDelayMs: { type: integer, minimum: 0, maximum: 5000 }
        timeoutMs: { type: integer, minimum: 100, maximum: 120000 }
    ReadJobInput:
      type: object
      additionalProperties: false
      required: [url]
      not:
        required: [browserAllowed, browserReadiness]
        properties:
          browserAllowed: { const: false }
      properties:
        url: { $ref: '#/components/schemas/PublicHttpUrl' }
        browserAllowed: { type: boolean }
        cacheMode: { type: string, enum: [prefer-cache, live, cache-only] }
        maxAgeSeconds: { type: integer, minimum: 1, maximum: 9007199254740991 }
        browserReadiness: { $ref: '#/components/schemas/BrowserReadiness' }
    MapJobInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { $ref: '#/components/schemas/PublicHttpUrl' }
        browserAllowed: { type: boolean }
        maxPages: { type: integer, minimum: 1, maximum: 500 }
        maxDepth: { type: integer, minimum: 0, maximum: 10 }
        includeSubdomains: { type: boolean }
        ignoreQueryParameters: { type: boolean }
    CrawlJobInput:
      type: object
      additionalProperties: false
      required: [url]
      not:
        required: [browserAllowed, browserReadiness]
        properties:
          browserAllowed: { const: false }
      properties:
        url: { $ref: '#/components/schemas/PublicHttpUrl' }
        browserAllowed: { type: boolean }
        cacheMode: { type: string, enum: [prefer-cache, live, cache-only] }
        maxAgeSeconds: { type: integer, minimum: 1, maximum: 9007199254740991 }
        browserReadiness: { $ref: '#/components/schemas/BrowserReadiness' }
        maxPages: { type: integer, minimum: 1, maximum: 10000 }
        maxDepth: { type: integer, minimum: 0, maximum: 10 }
        includeSubdomains: { type: boolean }
        ignoreQueryParameters: { type: boolean }
        concurrency: { type: integer, minimum: 1, maximum: 32 }
    SearchJobInput:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 512, pattern: '\S' }
        limit: { type: integer, minimum: 1, maximum: 20 }
        page: { type: integer, minimum: 1, maximum: 100 }
        language:
          type: string
          pattern: '^(?:all|[A-Za-z]{2,3}(?:[-_][A-Za-z0-9]{2,8})?)$'
        safeSearch: { type: integer, enum: [0, 1, 2] }
        timeRange: { type: string, enum: [day, month, year] }
        source: { type: string, enum: [auto, local, web] }
    ControlPlaneRequiredCapabilities:
      type: object
      additionalProperties: false
      properties:
        http: { type: boolean, const: true }
        browser: { type: boolean, const: true }
        pdf: { type: boolean, const: true }
        feed: { type: boolean, const: true }
    ProjectApiKeyScope:
      type: string
      enum: ['tasks:write', 'results:read', 'project:admin']
    ProjectApiKeyMetadata:
      type: object
      additionalProperties: false
      required:
        - id
        - display_prefix
        - scopes
        - created_by_user_id
        - created_at
        - last_used_at
        - expires_at
        - revoked_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        display_prefix: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ProjectApiKeyScope' }
        created_by_user_id: { $ref: '#/components/schemas/Uuid' }
        created_at: { type: string, format: date-time }
        last_used_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        revoked_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    CreateJobRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - input
        - data_class
        - placement
        - required_capabilities
        - budget
        - policy_version
        - upload_private_artifact
      properties:
        type:
          type: string
          enum: [read, inspect, map, crawl, search]
        input:
          $ref: '#/components/schemas/JsonObject'
        data_class:
          type: string
          enum: [public, authorized, intranet]
        placement:
          type: object
          additionalProperties: false
          required: [class, pinned_worker_id]
          properties:
            class:
              type: string
              enum: [public, private]
            pinned_worker_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
        required_capabilities:
          $ref: '#/components/schemas/ControlPlaneRequiredCapabilities'
        budget:
          type: object
          additionalProperties: false
          required:
            - deadline_ms
            - max_provider_attempts
            - max_document_bytes
            - max_browser_ms
            - max_browser_contexts
          properties:
            deadline_ms:
              type: integer
              minimum: 1
              maximum: 86400000
            max_provider_attempts:
              type: integer
              minimum: 1
              maximum: 1000000
            max_document_bytes:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            max_browser_ms:
              type: integer
              minimum: 0
              maximum: 86400000
            max_browser_contexts:
              type: integer
              minimum: 0
              maximum: 100000
        policy_version:
          type: string
          minLength: 1
          maxLength: 256
        upload_private_artifact:
          type: boolean
        priority:
          type: integer
          minimum: -100
          maximum: 100
          default: 0
        not_before:
          type: string
          format: date-time
      allOf:
        - oneOf:
            - properties:
                type: { const: read }
                input: { $ref: '#/components/schemas/ReadJobInput' }
            - properties:
                type: { const: inspect }
                input: { $ref: '#/components/schemas/ReadJobInput' }
            - properties:
                type: { const: map }
                input: { $ref: '#/components/schemas/MapJobInput' }
            - properties:
                type: { const: crawl }
                input: { $ref: '#/components/schemas/CrawlJobInput' }
            - properties:
                type: { const: search }
                input: { $ref: '#/components/schemas/SearchJobInput' }
    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - input
        - data_class
        - placement
        - required_capabilities
        - budget
        - policy_version
        - upload_private_artifact
        - priority
        - not_before
        - deadline_at
        - status
        - result_completeness
        - error_code
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum: [read, inspect, map, crawl, search]
        input:
          $ref: '#/components/schemas/JsonObject'
        data_class:
          type: string
          enum: [public, authorized, intranet]
        placement:
          type: object
          additionalProperties: false
          required: [class, pinned_worker_id]
          properties:
            class:
              type: string
              enum: [public, private]
            pinned_worker_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
        required_capabilities:
          $ref: '#/components/schemas/ControlPlaneRequiredCapabilities'
        budget:
          type: object
          additionalProperties: false
          required:
            - deadline_ms
            - max_provider_attempts
            - max_document_bytes
            - max_browser_ms
            - max_browser_contexts
          properties:
            deadline_ms: { type: integer, minimum: 1, maximum: 86400000 }
            max_provider_attempts: { type: integer, minimum: 1, maximum: 1000000 }
            max_document_bytes: { type: integer, minimum: 1, maximum: 9007199254740991 }
            max_browser_ms: { type: integer, minimum: 0, maximum: 86400000 }
            max_browser_contexts: { type: integer, minimum: 0, maximum: 100000 }
        policy_version:
          type: string
        upload_private_artifact:
          type: boolean
        priority:
          type: integer
        not_before:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [accepted, queued, assigned, running, paused, completed, failed, cancelled]
        result_completeness:
          oneOf:
            - type: string
              enum: [complete, partial]
            - type: 'null'
        error_code:
          oneOf:
            - type: string
            - type: 'null'
      allOf:
        - oneOf:
            - properties:
                type: { const: read }
                input: { $ref: '#/components/schemas/ReadJobInput' }
            - properties:
                type: { const: inspect }
                input: { $ref: '#/components/schemas/ReadJobInput' }
            - properties:
                type: { const: map }
                input: { $ref: '#/components/schemas/MapJobInput' }
            - properties:
                type: { const: crawl }
                input: { $ref: '#/components/schemas/CrawlJobInput' }
            - properties:
                type: { const: search }
                input: { $ref: '#/components/schemas/SearchJobInput' }
    Publication:
      type: object
      additionalProperties: false
      required:
        - id
        - job_id
        - lease_id
        - lease_generation
        - local_sequence
        - sequence
        - completeness
        - recorded_at
        - artifact
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        job_id: { $ref: '#/components/schemas/Uuid' }
        lease_id: { $ref: '#/components/schemas/Uuid' }
        lease_generation: { type: integer, minimum: 1 }
        local_sequence: { type: integer, minimum: 1 }
        sequence: { type: integer, minimum: 1 }
        completeness: { type: string, enum: [complete, partial] }
        recorded_at: { type: string, format: date-time }
        artifact:
          type: object
          additionalProperties: false
          required: [id, version, content_hash, byte_count, media_type, storage, object_key, created_at]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            version: { type: integer, minimum: 1 }
            content_hash: { type: string }
            byte_count: { type: integer, minimum: 0 }
            media_type: { type: string }
            storage: { type: string, enum: [worker_local, cloud_object] }
            object_key:
              oneOf:
                - type: string
                - type: 'null'
            created_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - actor_type
        - actor_id
        - action
        - target_type
        - target_id
        - outcome
        - correlation_id
        - occurred_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        actor_type: { type: string, enum: [user, api_key, worker] }
        actor_id: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        outcome: { type: string, enum: [succeeded, failed] }
        correlation_id: { type: string }
        occurred_at: { type: string, format: date-time }
    WebhookEventType:
      type: string
      enum: [job.completed, job.failed, job.cancelled]
    WebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, event_types, status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        url: { type: string, format: uri }
        event_types:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
    WebhookDelivery:
      type: object
      additionalProperties: false
      required:
        - id
        - event_id
        - endpoint_id
        - event_type
        - status
        - attempt_count
        - next_attempt_at
        - last_status_code
        - last_error
        - created_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        event_id: { $ref: '#/components/schemas/Uuid' }
        endpoint_id: { $ref: '#/components/schemas/Uuid' }
        event_type: { $ref: '#/components/schemas/WebhookEventType' }
        status: { type: string, enum: [pending, succeeded, dead_letter] }
        attempt_count: { type: integer, minimum: 0 }
        next_attempt_at: { type: string, format: date-time }
        last_status_code:
          oneOf:
            - type: integer
            - type: 'null'
        last_error:
          oneOf:
            - type: string
            - type: 'null'
        created_at: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, request_id, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        request_id: { $ref: '#/components/schemas/Uuid' }
        retryable: { type: boolean }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
  responses:
    HumanAuthBadRequest:
      description: Authentication query, headers, or body are malformed
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanAuthUnauthorized:
      description: OIDC state, Provider result, or refresh credential is invalid
      headers:
        Set-Cookie:
          description: May clear the invalid state or refresh cookie.
          schema: { type: string }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanAccessTokenUnauthorized:
      description: The human Access Token is missing, invalid, expired, or revoked
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanAuthRateLimited:
      description: Too many anonymous OIDC login attempts
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RefreshRotationConflict:
      description: Another request already rotated this refresh token during the grace window
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanAuthInternalError:
      description: The authentication request could not be completed
      headers:
        Set-Cookie:
          description: Callback failures may clear the state cookie.
          schema: { type: string }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanOrganizationForbidden:
      description: The Organization member lacks the owner or admin role required to create a Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OrganizationNotFound:
      description: The Organization is absent or hidden because the user has no membership
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProjectCreationConflict:
      description: >-
        The Organization already has this Project slug, or the Idempotency-Key is bound to
        a different request payload.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProjectValidationFailed:
      description: The Project creation request violates the contract
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MalformedRequest:
      description: A required header or request syntax is malformed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: The Project API Key is missing, invalid, expired, or revoked
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The API Key lacks scope or is bound to a different Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanUnauthorized:
      description: The human Access Token is missing, invalid, expired, or revoked
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HumanForbidden:
      description: The authenticated user is not an owner or admin of this Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ApiKeyNotFound:
      description: The API Key does not exist in the authenticated Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ApiKeyValidationFailed:
      description: The API Key creation request violates the contract
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyConflict:
      description: The Idempotency-Key is bound to a different request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    JobNotFound:
      description: The Job does not exist in the authenticated Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    JobTransitionConflict:
      description: The Job is missing from the Project or cannot perform the requested transition
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: { const: 409 }
    PayloadTooLarge:
      description: The request body exceeds 65536 bytes
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: The request is not application/json
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: The Job request body violates the contract
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ArtifactNotFound:
      description: The cloud Artifact does not exist in this Project or has not been uploaded
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ArtifactStorageDisabled:
      description: Cloud Artifact storage is not configured on this control plane
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WebhooksDisabled:
      description: Webhooks are disabled because no webhook encryption key is configured
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WebhookNotFound:
      description: The webhook endpoint or event does not exist in this Project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    QuotaExceeded:
      description: >-
        A Project quota or the per-API-key request rate is exhausted. Retry-After is present and
        retryable is true only when the limit resets with time.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: The request could not be completed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
